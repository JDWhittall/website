<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4f0e7"><meta name="description" content="A little pocket scoresheet for Inkling. Three rounds, two neighbours, all your guesses in one place."><title>Inkling · Pocket scoresheet</title>
<style>
:root{--paper:#f4f0e7;--ink:#242d2a;--muted:#68716a;--line:#d8dbd1;--red:#b44731;--green:#2b6251;--soft:#e6ebe1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:3px}input:focus,select:focus{outline:2px solid var(--green);outline-offset:2px}button{border:0;background:none}a{color:var(--green)}.shell{max-width:620px;margin:auto;padding:24px 20px 36px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.eyebrow{font:700 10px/1.4 system-ui;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.brand{font:italic 700 39px/1 Georgia,serif;letter-spacing:-2px}.brand span{color:var(--red)}.top button{border:1px solid var(--line);border-radius:50%;width:44px;height:44px;font:italic 22px Georgia}.intro{display:flex;justify-content:space-between;gap:16px;align-items:end}.intro p{margin:4px 0 0;color:var(--muted);font-size:14px}.intro h1{font:32px/1.15 Georgia,serif;margin:5px 0}.status{white-space:nowrap;color:var(--green);font-size:11px;padding-bottom:4px}.name{margin-top:24px;display:flex;align-items:center;gap:12px}.name label{font-size:12px;color:var(--muted);white-space:nowrap}.name input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;border-radius:0}.steps{display:flex;margin:26px 0 24px;gap:5px}.step{flex:1;padding:10px 4px;border-bottom:2px solid var(--line);font-size:12px;color:var(--muted)}.step.active{border-color:var(--red);color:var(--red);font-weight:750}.step.done{border-color:var(--green);color:var(--green)}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:5px;background:#e6e6dc;border-radius:14px;gap:4px;margin-bottom:22px}.tab{padding:12px 8px;border-radius:10px;display:flex;justify-content:center;align-items:center;gap:9px;font-weight:650;font-size:14px}.tab[aria-selected=true]{background:#fffdf7;box-shadow:0 2px 5px #27302412}.tab small{font-size:11px;font-weight:500;color:var(--muted)}.sheet{background:#fffdf7;border:1px solid #e0e1d6;border-radius:17px;padding:20px 18px 18px;box-shadow:0 5px 14px #28322105}.sheethead{display:flex;gap:12px;align-items:center}.arrow{background:var(--soft);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:22px}.sheethead label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.sheethead input{padding:3px 0;width:100%;border:0;background:none;font:23px Georgia,serif}.sheethead>div:nth-child(2){flex:1;min-width:0}.remaining{font-size:12px;color:var(--green);white-space:nowrap}.dots{display:flex;gap:5px;margin-top:6px}.dot{width:7px;height:7px;border:1px solid #9aa699;border-radius:50%}.dot.used{background:var(--green);border-color:var(--green)}.colhead{display:flex;justify-content:space-between;margin:26px 0 3px;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}.guess{display:flex;align-items:center;min-height:57px;border-bottom:1px solid var(--line);gap:10px}.num{font:italic 15px Georgia;color:#8b9389;min-width:16px}.word{flex:1;min-width:0}.word strong{font-size:16px;font-weight:550;overflow-wrap:anywhere}.word small{display:block;color:var(--muted);font-size:10px}.guess input{width:100%;min-width:0;border:0;background:none;padding:14px 0}.remove{font-size:20px;color:var(--muted);min-width:44px;min-height:44px}.locked{font-size:10px;color:var(--muted)}.empty{color:#92998e;font-size:14px}.point{border:1px solid var(--line);border-radius:8px;background:white;padding:10px 6px;max-width:90px;font-size:13px}.form{display:flex;gap:8px;margin-top:18px}.form input{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper)}.add{width:48px;flex:none;border-radius:10px;color:white;background:var(--green);font-size:25px}.note{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.6}.primary{background:var(--ink);color:var(--paper);border-radius:12px;padding:16px 20px;width:100%;margin-top:20px;display:flex;justify-content:space-between;font-weight:650}.phase-note{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 24px}.footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:17px;margin-top:28px}.footer button{font-size:12px;color:var(--muted);padding:8px 0}.scorebox{margin-top:20px;border:1px solid var(--line);border-radius:12px;padding:16px}.scorebox h2{font:22px Georgia;margin:0 0 12px}.scoreline{display:flex;justify-content:space-between;padding:8px 0;align-items:center;font-size:14px}.scoreline input{width:75px;border:1px solid var(--line);background:#fffdf7;border-radius:8px;padding:9px;text-align:center}.total{background:var(--green);color:white;border-radius:15px;padding:20px;margin-top:20px;display:flex;justify-content:space-between;align-items:center}.total b{font:52px/1 Georgia}.total small{display:block;opacity:.8;font-size:12px}.scorevalue{font:28px Georgia}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:10px;padding:12px 18px;max-width:calc(100% - 30px);width:max-content;z-index:4;font-size:13px;box-shadow:0 3px 16px #0002}dialog{color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:18px;max-width:440px;width:calc(100% - 32px);padding:24px;max-height:85dvh;overflow:auto}dialog::backdrop{background:#192a255e;backdrop-filter:blur(3px)}dialog h2{font:28px Georgia;margin:0 0 14px}dialog p,dialog li{font-size:14px}dialog ul{padding-left:20px}dialog .close{float:right;font-size:23px;min-width:44px;min-height:44px;margin:-12px -12px 0 0}.secondary{padding:13px;border:1px solid var(--line);border-radius:10px;font-size:14px}.actions{display:flex;gap:10px;margin-top:22px}.actions>*{flex:1}.actions .primary{margin:0;display:block}.bigletter{font:italic 90px/1 Georgia;color:#d5dbcd;position:absolute;z-index:-1;right:calc(50% - 335px);top:90px;transform:rotate(14deg)}@media(min-width:700px){.shell{padding-top:40px}.intro h1{font-size:39px}.sheet{padding:24px}.top{margin-bottom:32px}}@media(max-width:380px){.shell{padding:20px 14px}.sheet{padding:16px 12px}.tab{font-size:13px;gap:5px}.remaining{font-size:11px}.intro h1{font-size:29px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,transform .15s}button:active{transform:translateY(1px)}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">inkling<span>.</span></div><div class="eyebrow" style="margin-top:8px">The pocket scoresheet</div></div><button id="help" aria-label="How to use this scoresheet">?</button></header><main><div class="intro"><div><div class="eyebrow" id="phaseLabel"></div><h1 id="heading"></h1><p id="subtitle"></p></div><span class="status" id="saved" role="status">● On this device</span></div><div class="name"><label for="yourName">Your name</label><input id="yourName" placeholder="Make your mark" maxlength="40" autocomplete="off"></div><div class="steps" id="steps" aria-label="Game progress"></div><nav class="tabs" role="tablist" aria-label="Neighbour"><button class="tab" id="leftTab" role="tab" data-side="left"></button><button class="tab" id="rightTab" role="tab" data-side="right"></button></nav><section class="sheet" id="sheet" role="tabpanel"></section><div id="score"></div><button class="primary" id="next"></button><p class="phase-note" id="phaseNote"></p></main><footer class="footer"><button id="download">↓ Offline copy</button><button id="reset">New game ↗</button></footer><p class="note" style="text-align:center;font-size:10px">An unofficial companion for Inkling by John Keyworth / Osprey Games.</p></div><dialog id="modal"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='inkling-pocket-v1';
const fresh=()=>({v:1,round:1,side:'left',name:'',names:{left:'',right:''},guesses:{left:[],right:[]},ink:{left:'',right:''},done:false});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function valid(s){return s&&s.v===1&&Number.isInteger(s.round)&&s.round>=1&&s.round<=4&&['left','right'].includes(s.side)&&typeof s.name==='string'&&s.names&&s.ink&&s.guesses&&['left','right'].every(k=>typeof s.names[k]==='string'&&(s.ink[k]===''||Number.isInteger(s.ink[k])&&s.ink[k]>=0&&s.ink[k]<=99)&&Array.isArray(s.guesses[k])&&s.guesses[k].length<=7&&s.guesses[k].every(g=>typeof g.word==='string'&&g.word.trim()&&Number.isInteger(g.round)&&g.round>=1&&g.round<=Math.min(s.round,3)&&(g.points===null||[0,1,2,3].includes(g.points))));}
let state=fresh(),storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(valid(parsed))state=parsed;else storageOK=false;}}catch{storageOK=false;}
const $=id=>document.getElementById(id);let toastTimer;
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3200);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch{storageOK=false;}$('saved').textContent=storageOK?'● Saved here':'○ Not saved';$('saved').title=storageOK?'Saved in this browser on this device':'Browser storage is unavailable. Keep this page open.';}
const count=()=>state.guesses.left.length+state.guesses.right.length;
const guessing=side=>state.guesses[side].reduce((n,g)=>n+(g.points||0),0);
const total=()=>guessing('left')+guessing('right')+Number(state.ink.left||0)+Number(state.ink.right||0);
const pending=()=>['left','right'].reduce((n,k)=>n+state.guesses[k].filter(g=>g.points===null).length+(state.ink[k]===''?1:0),0);
function modal(html){$('modal').innerHTML='<button class="close" aria-label="Close dialog">×</button>'+html;$('modal').querySelector('.close').onclick=()=>$('modal').close();$('modal').showModal();}
function render(){
const scoring=state.round===4,side=state.side,gs=state.guesses[side];
$('phaseLabel').textContent=scoring?'The reveal':`Round ${state.round} of 3`;
$('heading').textContent=scoring?(state.done?'A little word magic.':'Time to compare notes.'):'Got an inkling?';
$('subtitle').textContent=scoring?'Reveal the clue cards. Count the good guesses.':'Read the cards. Keep your guesses to yourself.';
$('yourName').value=state.name;
$('steps').innerHTML=[1,2,3,4].map(n=>`<div class="step ${state.round===n?'active':state.round>n?'done':''}" ${state.round===n?'aria-current="step"':''}>${state.round>n?'✓ ':''}${n===4?'Score':`Round ${n}`}</div>`).join('');
for(const k of ['left','right']){const el=$(k+'Tab');el.setAttribute('aria-selected',String(side===k));el.tabIndex=side===k?0:-1;el.innerHTML=`${k==='left'?'←':'→'} ${k==='left'?'Left':'Right'} neighbour <small>${state.guesses[k].length}/7</small>`;}
$('sheet').setAttribute('aria-labelledby',side+'Tab');
$('sheet').innerHTML=`<div class="sheethead"><div class="arrow" aria-hidden="true">${side==='left'?'←':'→'}</div><div><label for="neighbourName">On your ${side}</label><input id="neighbourName" placeholder="Their name" maxlength="40" value="${esc(state.names[side])}" autocomplete="off"></div><div class="remaining">${7-gs.length} guesses left<div class="dots" aria-hidden="true">${Array.from({length:7},(_,i)=>`<span class="dot ${i<gs.length?'used':''}"></span>`).join('')}</div></div></div><div class="colhead"><span>Your guesses</span><span>${scoring?'Points':'Round'}</span></div><div id="rows">${Array.from({length:7},(_,i)=>{const g=gs[i];if(!g)return `<div class="guess"><span class="num">${i+1}</span><span class="empty">${i===gs.length&&!scoring?'Your next inkling…':'—'}</span></div>`;const editable=!scoring&&g.round===state.round;return `<div class="guess"><span class="num">${i+1}</span><div class="word">${editable?`<input aria-label="Guess ${i+1}" data-edit="${i}" maxlength="60" value="${esc(g.word)}" autocomplete="off" autocorrect="off" spellcheck="false">`:`<strong>${esc(g.word)}</strong>${scoring?`<small>Round ${g.round}</small>`:''}`}</div>${scoring?`<select class="point" aria-label="Points for ${esc(g.word)}" data-points="${i}"><option value="" ${g.points===null?'selected':''}>Score…</option>${[0,1,2,3].map(p=>`<option value="${p}" ${g.points===p?'selected':''}>${p===0?'× Miss':p+' pt'+(p>1?'s':'')}</option>`).join('')}</select>`:`<span class="locked">R${g.round}${editable?'':' · fixed'}</span>${editable?`<button class="remove" data-remove="${i}" aria-label="Remove guess ${i+1}">×</button>`:''}`}</div>`;}).join('')}</div>${!scoring?`<form class="form" id="guessForm"><label class="sr" for="guessInput">New guess for your ${side} neighbour</label><input id="guessInput" maxlength="60" placeholder="Write a guess…" autocomplete="off" autocorrect="off" spellcheck="false" ${gs.length===7?'disabled':''}><button class="add" aria-label="Add guess" ${gs.length===7?'disabled':''}>+</button></form><p class="note">Seven guesses per neighbour, for the whole game. You can edit this round’s words until you move on.</p>`:`<p class="note">Use each correct word’s value on their clue card. A miss is 0. Count each clue word only once, even if you guessed it twice.</p><div class="scoreline" style="margin-top:12px"><span>Your guessing score · ${esc(state.names[side]||side)}</span><b class="scorevalue">${guessing(side)}</b></div>`}`;
$('score').innerHTML=scoring?`<div class="scorebox"><h2>How well did your ink speak?</h2><p class="note">Ask each neighbour for the points they earned guessing <em>your</em> words. Enter 0 if they scored none.</p>${['left','right'].map(k=>`<div class="scoreline"><label for="ink-${k}">${k==='left'?'←':'→'} ${esc(state.names[k]||k+' neighbour')}’s score for you</label><input id="ink-${k}" data-ink="${k}" type="number" inputmode="numeric" min="0" max="99" step="1" placeholder="—" value="${state.ink[k]}"></div>`).join('')}</div><div class="total"><div><span class="eyebrow" style="color:#c9d9cd">${state.done?'Final score':'Score so far'}</span><small>${guessing('left')+guessing('right')} guessing + ${Number(state.ink.left||0)+Number(state.ink.right||0)} ink</small></div><b>${total()}</b></div><p class="note" style="text-align:center">${count()} guesses used · Fewer guesses wins a tied score.</p>`:'';
$('next').innerHTML=scoring?(state.done?'✓ Scoresheet complete':`Finish scoresheet <span>✓</span>`):`${state.round===3?'Reveal & score':'Finish round '+state.round} <span>→</span>`;
$('next').disabled=scoring&&(state.done||pending()>0);
$('phaseNote').textContent=scoring?(pending()>0?`${pending()} scoring ${pending()===1?'entry':'entries'} still needed across both neighbours.`:'Your two guessing scores + your two ink scores.'):'Move on when everyone at the table is ready.';
bindSheet();
}
function bindSheet(){
$('neighbourName').oninput=e=>{state.names[state.side]=e.target.value;save();};
$('guessForm')?.addEventListener('submit',e=>{e.preventDefault();const input=$('guessInput'),word=input.value.trim();if(!word||state.round>3||state.guesses[state.side].length>=7)return;if(state.guesses[state.side].some(g=>g.word.toLocaleLowerCase()===word.toLocaleLowerCase())){toast('That word is already on this side.');return;}state.guesses[state.side].push({word,round:state.round,points:null});save();render();$('guessInput')?.focus();});
$('sheet').querySelectorAll('[data-edit]').forEach(el=>el.onchange=()=>{const g=state.guesses[state.side][+el.dataset.edit];if(g.round!==state.round||state.round>3)return;const word=el.value.trim();if(!word){el.value=g.word;toast('Use × to remove a guess.');return;}if(state.guesses[state.side].some((x,i)=>i!==+el.dataset.edit&&x.word.toLocaleLowerCase()===word.toLocaleLowerCase())){el.value=g.word;toast('That word is already on this side.');return;}g.word=word;save();});
$('sheet').querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{const i=+el.dataset.remove;if(state.guesses[state.side][i].round!==state.round||state.round>3)return;state.guesses[state.side].splice(i,1);save();render();});
$('sheet').querySelectorAll('[data-points]').forEach(el=>el.onchange=()=>{state.guesses[state.side][+el.dataset.points].points=el.value===''?null:Number(el.value);state.done=false;save();render();});
$('score').querySelectorAll('[data-ink]').forEach(el=>el.onchange=()=>{if(el.value!==''&&(!Number.isInteger(Number(el.value))||Number(el.value)<0||Number(el.value)>99)){toast('Enter a whole number from 0 to 99.');el.value=state.ink[el.dataset.ink];return;}state.ink[el.dataset.ink]=el.value===''?'':Number(el.value);state.done=false;save();render();});
}
function switchSide(k){const draft=$('guessInput')?.value.trim();if(draft){toast('Add your draft with + before changing sides.');$('guessInput').focus();return;}state.side=k;save();render();$(k+'Tab').focus();}
for(const k of ['left','right']){$(k+'Tab').onclick=()=>switchSide(k);$(k+'Tab').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();switchSide(k==='left'?'right':'left');}};}
$('yourName').oninput=e=>{state.name=e.target.value;save();};
$('next').onclick=()=>{if(state.round===4){if(!pending()){state.done=true;save();render();toast('All added up. Good game!');}return;}if($('guessInput')?.value.trim()){toast('Add your draft with + before finishing the round.');$('guessInput').focus();return;}modal(`<div class="eyebrow">Round ${state.round} of 3</div><h2>${state.round===3?'Ready for the reveal?':'Pens down?'}</h2><p>This round’s guesses will be fixed. ${state.round===3?'Reveal clue cards only once everyone has finished.':'Check both neighbours before moving on.'}</p><p>${state.guesses.left.length}/7 left guesses · ${state.guesses.right.length}/7 right guesses used so far.</p><div class="actions"><button class="secondary" id="cancelAdvance">Keep writing</button><button class="primary" id="confirmAdvance">${state.round===3?'Reveal & score':'Next round →'}</button></div>`);$('cancelAdvance').onclick=()=>$('modal').close();$('confirmAdvance').onclick=()=>{state.round++;save();$('modal').close();render();window.scrollTo({top:0,behavior:'smooth'});};};
$('reset').onclick=()=>{modal('<h2>A fresh sheet?</h2><p>This clears all guesses and scores on this device. Your name and neighbours will stay.</p><div class="actions"><button class="secondary" id="cancelReset">Keep this game</button><button class="primary" id="confirmReset">Start new game</button></div>');$('cancelReset').onclick=()=>$('modal').close();$('confirmReset').onclick=()=>{state={...fresh(),name:state.name,names:{...state.names}};save();$('modal').close();render();window.scrollTo(0,0);};};
$('help').onclick=()=>modal(`<div class="eyebrow">A small guide</div><h2>Your seat. Your sheet.</h2><ul><li>Write guesses for your left and right neighbours in their own tabs.</li><li>You have <b>seven guesses per neighbour across all three rounds</b>. You can guess several words in a round, or none.</li><li>Finish a round when everyone is ready. Previous rounds’ guesses stay fixed.</li><li>After round three, reveal the clue cards. Give each guess 0, 1, 2 or 3 points using the card. Count each clue word once.</li><li>Ask each neighbour for their guessing score for your words. These are your two ink scores.</li><li>Add all four scores. Highest total wins; ties go to the player with fewer guesses. Still tied? Share the win.</li></ul><p><b>Just your device.</b> Nothing is synced with other players. Progress saves in this browser. Clearing browser data or using a private tab can remove it.</p><p><b>Take it offline.</b> “Offline copy” downloads a self-contained HTML file. Share that file, and each player can open their own copy in a browser. Saving local-file progress depends on the browser.</p><p><a href="https://www.ospreypublishing.com/media/pp5no1xc/inkling_rulebook_bgg_upload.pdf" target="_blank" rel="noopener">Official Inkling rules ↗</a></p>`);
$('download').onclick=()=>{const copy=document.documentElement.cloneNode(true);copy.querySelector('#modal').removeAttribute('open');copy.querySelector('#modal').innerHTML='';copy.querySelector('#toast').hidden=true;copy.querySelector('#toast').textContent='';copy.querySelector('#yourName').removeAttribute('value');copy.querySelector('#sheet').innerHTML='';copy.querySelector('#score').innerHTML='';const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download='inkling-scoresheet.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Offline copy downloaded. Share the HTML file.');};
render();if(storageOK)save();else{$('saved').textContent='○ Not saved';toast('Saved data could not be read. This sheet is temporary until your next change.');}
</script></body></html>
